<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PetVision{% endblock %}</title>
  <link rel="stylesheet" href="/css/style.css?v=5">
  <script src="/js/theme.js?v=5" defer></script>
  <script src="/js/main.js?v=5" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="PetVision home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></span><span>Pet<span>Vision</span></span><small>AI Image Classifier</small></a>
      <nav class="top-nav">
        {% for item, href in [("Home", "/"), ("Classify", "/classifier"), ("About", "/about"), ("Dataset", "/history"), ("Contact", "/about")] %}
        <a class="{% if (page == 'home' and item == 'Home') or (page == 'classifier' and item == 'Classify') %}active{% endif %}" href="{{ href }}">{{ item }}</a>
        {% endfor %}
      </nav>
      <div class="topbar-actions"><button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false"><span>☀</span><i></i><b>◐</b></button><a class="top-upload" href="/classifier">▣ &nbsp; Upload &amp; Predict</a></div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer><span>PetVision</span> · Built for responsible image intelligence</footer>
  </div>
</body>
</html>
